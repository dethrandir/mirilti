[package]
name = "mirilti"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mirilti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Faz 1b (§10 A planı): KDE/Wayland global kısayolları için XDG Desktop
# Portal `org.freedesktop.portal.GlobalShortcuts` erişimi.
# `global_shortcuts` modülü varsayılan (yalnızca "tokio") feature'larda kapalıdır;
# modülü aktif etmek için feature'ı açıkça eklemek gerekir.
ashpd = { version = "0.13", features = ["global_shortcuts", "remote_desktop", "screencast"] }
# `stream::select` ile Activated/Deactivated sinyallerini tek akışta birleştirir
# (futures-util zaten ashpd/zbus'un getirdiği bir bağımlılıktır).
futures-util = "0.3"

# --- Faz 2 (§6 Ses yakalama): cihaz listesi + kayıt + yeniden örnekleme + WAV ---
# cpal: ses giriş cihazları, toplama. PipeWire üzerinden ALSA/Pulse uyumlu.
# rubato: 48k→16k yeniden örnekleme + kanal downmix (yüksek kalite).
# hound: WAV başlık/veri yazma. ffmpeg yok (İlke: ses dönüşümü Rust içinde).
cpal = "0.15"
rubato = "0.15"
hound = "3"

[dev-dependencies]
# Yalnızca testler için; üretim kodu Tauri'nin kendi tokio runtime'ını kullanır.
tokio = { version = "1", features = ["macros", "rt"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
